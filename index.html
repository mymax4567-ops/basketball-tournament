<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>籃球錦標賽</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF6B00;--dark:#0A0A0F;--dark2:#13131A;--dark3:#1C1C26;--card:#1E1E2A;--border:#2A2A3A;--text:#E8E8F0;--muted:#8888A0;--green:#00C896;--red:#FF4466;--gold:#FFD700;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}
.page-wrap{max-width:680px;margin:0 auto;}
/* ── HEADER ── */
header{position:relative;overflow:hidden;border-bottom:3px solid var(--orange);background:linear-gradient(135deg,#0A0A0F 0%,#1a0a00 50%,#0A0A0F 100%);}
.header-org-bar{font-size:10px;color:rgba(255,255,255,0.6);text-align:center;padding:6px 48px;border-bottom:1px solid rgba(255,107,0,0.2);letter-spacing:0.5px;line-height:1.6;background:rgba(0,0,0,0.3);}
.header-org-bar:empty{display:none;}
.header-body{display:flex;align-items:center;justify-content:space-between;padding:16px 8px 20px;position:relative;z-index:1;min-height:160px;}
.header-left-img{width:28%;display:flex;align-items:flex-end;justify-content:center;flex-shrink:0;}
.header-left-img img{max-width:100%;max-height:150px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));}
.header-left-img img[src=""],
.header-right-img img[src=""]{display:none;}
.header-right-img{width:28%;display:flex;align-items:flex-end;justify-content:center;flex-shrink:0;}
.header-right-img img{max-width:100%;max-height:150px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));}
.header-center{flex:1;text-align:center;padding:0 8px;}
.header-badge{display:inline-block;background:var(--orange);color:#fff;font-size:10px;font-weight:900;letter-spacing:2px;padding:3px 14px;border-radius:20px;margin-bottom:8px;}
.header-badge:empty{display:none;}
#pub-title{margin:0 0 6px;line-height:1.1;text-shadow:0 2px 20px rgba(0,0,0,0.5);}
.header-sub{font-size:12px;margin-top:4px;letter-spacing:1px;}
.header-sub:empty{display:none;}
.header-venue{display:inline-block;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:12px;font-weight:700;padding:4px 14px;border-radius:4px;margin-top:6px;}
.header-venue:empty{display:none;}
.lang-btn{position:absolute;top:10px;right:10px;background:rgba(255,107,0,0.15);border:1px solid var(--orange);color:var(--orange);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;cursor:pointer;z-index:10;letter-spacing:1px;}
.live-dot{display:inline-flex;align-items:center;gap:5px;background:rgba(255,68,102,0.15);border:1px solid var(--red);color:var(--red);font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:8px;}
.live-dot::before{content:'';width:6px;height:6px;background:var(--red);border-radius:50%;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.tabs{display:flex;background:var(--dark2);border-bottom:1px solid var(--border);}
.tab{flex:1;padding:16px 8px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);background:rgba(255,107,0,0.05);}
.tab-icon{font-size:20px;display:block;margin-bottom:3px;}
.section{display:none;padding:16px;}
.section.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.card-title{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--orange);margin-bottom:14px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}
.bracket-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px;}
.bk-outer{display:inline-flex;align-items:flex-start;gap:0;padding:8px;}
.bk-col{display:flex;flex-direction:column;align-items:center;}
.bk-col-title{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--orange);text-transform:uppercase;text-align:center;margin-bottom:8px;white-space:nowrap;}
.bk-col-body{position:relative;}
.bk-match{position:absolute;background:var(--dark3);border:1px solid var(--border);border-radius:8px;width:120px;overflow:hidden;left:8px;}
.bk-team{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;}
.bk-team:last-child{border-bottom:none;}
.bk-team.winner{background:rgba(255,107,0,0.15);color:var(--orange);}
.bk-score{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--orange);margin-left:4px;flex-shrink:0;}
.bk-conn{position:relative;flex-shrink:0;}
.bk-champ{background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(255,107,0,0.1));border:2px solid var(--gold);border-radius:10px;padding:12px;text-align:center;width:100px;}
.bk-champ-crown{font-size:22px;}
.bk-champ-label{font-size:8px;letter-spacing:2px;color:var(--gold);font-weight:700;margin:3px 0;}
.bk-champ-name{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold);}
.bracket{display:flex;gap:0;min-width:500px;padding:10px 0;align-items:center;}
.round{display:flex;flex-direction:column;}
.round-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--orange);text-transform:uppercase;text-align:center;margin-bottom:12px;padding:0 8px;}
.match-slot{display:flex;flex-direction:column;gap:2px;padding:0 8px;}
.team-slot{background:var(--dark3);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:15px;font-weight:700;min-width:130px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.team-slot.winner{background:rgba(255,107,0,0.12);border-color:var(--orange);color:var(--orange);}
.team-slot.tbd{color:var(--muted);font-style:italic;font-weight:400;}
.slot-score{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--orange);min-width:20px;text-align:right;}
.match-divider{height:6px;border-left:2px solid var(--border);margin-left:50%;}
.champion-box{background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(255,107,0,0.1));border:2px solid var(--gold);border-radius:12px;padding:16px;text-align:center;min-width:110px;}
.champion-crown{font-size:28px;}
.champion-label{font-size:9px;letter-spacing:2px;color:var(--gold);font-weight:700;margin:4px 0;}
.champion-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);}
.game-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
.game-item:last-child{border-bottom:none;}
.game-time{min-width:50px;font-size:13px;color:var(--muted);font-weight:700;}
.game-court{font-size:12px;color:var(--muted);}
.game-teams{flex:1;font-size:15px;font-weight:700;}
.game-status{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:1px;}
.status-done{background:rgba(0,200,150,0.15);color:var(--green);border:1px solid rgba(0,200,150,0.3);}
.status-live{background:rgba(255,68,102,0.15);color:var(--red);border:1px solid rgba(255,68,102,0.3);animation:pulse 1s infinite;}
.status-upcoming{background:rgba(136,136,160,0.1);color:var(--muted);border:1px solid var(--border);}
.info-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.info-item:last-child{border-bottom:none;}
.info-icon{width:36px;height:36px;background:rgba(255,107,0,0.12);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.info-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;}
.info-value{font-size:14px;font-weight:700;margin-top:2px;}
.info-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.notice-item{background:rgba(255,107,0,0.06);border-left:3px solid var(--orange);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:10px;}
.notice-time{font-size:10px;color:var(--muted);margin-bottom:4px;}
.notice-text{font-size:13px;font-weight:700;}
.notice-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
footer{text-align:center;padding:16px;color:var(--muted);font-size:10px;border-top:1px solid var(--border);letter-spacing:1px;}
.standings-table{width:100%;border-collapse:collapse;font-size:12px;}
.standings-table th{text-align:center;padding:8px 4px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1px;border-bottom:1px solid var(--border);}
.standings-table th:first-child{text-align:left;}
.standings-table td{text-align:center;padding:10px 4px;border-bottom:1px solid rgba(42,42,58,0.5);font-weight:700;}
.standings-table td:first-child{text-align:left;}
.standings-table tr:last-child td{border-bottom:none;}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:900;margin-right:4px;}
.rank-1{background:var(--gold);color:#000;}
.rank-2{background:#C0C0C0;color:#000;}
.rank-3{background:#CD7F32;color:#fff;}
.rank-other{background:var(--border);color:var(--muted);}
.advance-tag{display:inline-block;background:rgba(0,200,150,0.15);color:var(--green);font-size:9px;padding:1px 5px;border-radius:4px;margin-left:2px;font-weight:700;}
.group-label{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:var(--orange);margin-bottom:10px;}
</style>
</head>
<body>
<header id="pub-header-wrap">
  <button class="lang-btn" onclick="toggleLang()" id="lang-toggle">EN</button>
  <!-- 頂部單位資訊列 -->
  <div class="header-org-bar" id="pub-org-bar"></div>
  <!-- 主視覺區 -->
  <div class="header-body">
    <!-- 左側圖片 -->
    <div class="header-left-img">
      <img id="pub-left-img" src="" alt="" />
    </div>
    <!-- 中間文字 -->
    <div class="header-center">
      <div class="header-badge" id="pub-badge"></div>
      <h1 id="pub-title"></h1>
      <div class="header-sub" id="pub-subtitle"></div>
      <div class="header-venue" id="pub-venue"></div>
      <div class="live-dot" id="live-label" style="margin-top:10px">LIVE 即時更新中</div>
    </div>
    <!-- 右側圖片 -->
    <div class="header-right-img">
      <img id="pub-right-img" src="" alt="" />
    </div>
  </div>
</header>
<div class="page-wrap">
<nav class="tabs">
  <div class="tab active" id="tab-bracket" onclick="showTab('bracket')"><span class="tab-icon">🏆</span><span data-zh="晉級賽" data-en="Bracket">晉級賽</span></div>
  <div class="tab" id="tab-info" onclick="showTab('info')"><span class="tab-icon">ℹ️</span><span data-zh="活動" data-en="Info">活動</span></div>
</nav>
<div class="section active" id="section-bracket">
  <div class="card">
    <div class="card-title" id="ct-bracket">🏆 淘汰賽對戰圖</div>
    <div class="bracket-wrapper"><div class="bracket" id="bracket-display"><div class="loading">載入中...</div></div></div>
  </div>
  <div class="card">
    <div class="card-title" id="ct-schedule">📋 晉級賽程</div>
    <div id="bracket-schedule"><div class="loading">載入中...</div></div>
  </div>
</div>
<div class="section" id="section-info">
  <div class="card">
    <div class="card-title" id="ct-info">ℹ️ 活動基本資訊</div>
    <div id="pub-info-list"><div class="loading">載入中...</div></div>
  </div>
  <div class="card">
    <div class="card-title" id="ct-notices">📢 最新公告</div>
    <div id="pub-notice-list"><div class="loading">載入中...</div></div>
  </div>
  <div class="card">
    <div class="card-title" id="ct-contacts">📞 聯絡資訊</div>
    <div id="pub-contact-list"><div class="loading">載入中...</div></div>
  </div>
</div>
</div>
<footer id="pub-footer">🏀 籃球錦標賽 · 技術支援：主辦單位</footer>

<script>
const firebaseConfig={apiKey:"AIzaSyAvXt3l1WIwuwzTEiK8f0pXtC73qyu8p28",authDomain:"funplay-f29f4.firebaseapp.com",databaseURL:"https://funplay-f29f4-default-rtdb.firebaseio.com",projectId:"funplay-f29f4",storageBucket:"funplay-f29f4.firebasestorage.app",messagingSenderId:"931596968438",appId:"1:931596968438:web:c47a7c31f4cc3b4adee7d7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let lang='zh';
let gameData={};

// ── STATS TRACKING ──
function trackVisit(){db.ref('/stats/visits').transaction(v=>(v||0)+1);}
function trackTab(t){db.ref('/stats/tabs/'+t).transaction(v=>(v||0)+1);}
trackVisit();

// ── LANGUAGE ──
function toggleLang(){
  lang=lang==='zh'?'en':'zh';
  document.getElementById('lang-toggle').textContent=lang==='zh'?'EN':'中文';
  applyLang();
  renderAll();
}
function applyLang(){
  document.querySelectorAll('[data-zh]').forEach(el=>{el.textContent=lang==='zh'?el.dataset.zh:el.dataset.en;});
  const d=gameData.header||{};

  // Org bar
  const orgEl=document.getElementById('pub-org-bar');
  if(orgEl) orgEl.innerHTML=d.orgBar||'';

  // Badge
  const badgeEl=document.getElementById('pub-badge');
  if(badgeEl) badgeEl.textContent=lang==='en'&&d.badgeEn?d.badgeEn:(d.badge||'');

  // Title
  const titleEl=document.getElementById('pub-title');
  if(titleEl){
    titleEl.innerHTML=lang==='en'&&d.titleEn?d.titleEn:(d.title||'🏀 籃球錦標賽');
    titleEl.style.fontFamily=d.titleFont==='bebas'?'"Bebas Neue",sans-serif':'"Noto Sans TC",sans-serif';
    titleEl.style.fontSize=(d.titleSize||44)+'px';
    titleEl.style.fontWeight=d.titleFont==='bebas'?'400':'900';
    titleEl.style.color=d.titleColor||'#FFFFFF';
    titleEl.style.letterSpacing=d.titleFont==='bebas'?'3px':'1px';
  }

  // Subtitle
  const subEl=document.getElementById('pub-subtitle');
  if(subEl){
    subEl.textContent=lang==='en'&&d.subtitleEn?d.subtitleEn:(d.subtitle||'');
    subEl.style.color=d.subtitleColor||'#aaaaaa';
    subEl.style.fontSize=(d.subtitleSize||12)+'px';
  }

  // Venue tag
  const venueEl=document.getElementById('pub-venue');
  if(venueEl) venueEl.textContent=d.venue||'';

  // Background
  const hdr=document.getElementById('pub-header-wrap');
  if(d.bgColor) hdr.style.background=d.bgColor;
  else hdr.style.background='linear-gradient(135deg,#0A0A0F 0%,#1a0a00 50%,#0A0A0F 100%)';

  // Left/Right images
  const lImg=document.getElementById('pub-left-img');
  const rImg=document.getElementById('pub-right-img');
  if(lImg) lImg.src=d.leftImgBase64||'';
  if(rImg) rImg.src=d.rightImgBase64||'';

  document.getElementById('live-label').textContent=lang==='zh'?'LIVE 即時更新中':'LIVE Updating';
  document.getElementById('ct-bracket').innerHTML=lang==='zh'?'🏆 淘汰賽對戰圖':'🏆 Elimination Bracket';
  document.getElementById('ct-schedule').innerHTML=lang==='zh'?'📋 晉級賽程':'📋 Schedule';
  document.getElementById('ct-info').innerHTML=lang==='zh'?'ℹ️ 活動基本資訊':'ℹ️ Event Info';
  document.getElementById('ct-notices').innerHTML=lang==='zh'?'📢 最新公告':'📢 Announcements';
  document.getElementById('ct-contacts').innerHTML=lang==='zh'?'📞 聯絡資訊':'📞 Contacts';
  document.title=(d.title||'籃球錦標賽').replace(/<[^>]+>/g,'');
}

// ── TAB ──
function showTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['bracket','info'][i]===name));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==='section-'+name));
  trackTab(name);
}

// ── LOAD ──
db.ref('/game').on('value',snap=>{
  gameData=snap.val()||{};
  // Logo
  const logo=document.getElementById('pub-logo');
  if(gameData.header?.logoBase64){logo.src=gameData.header.logoBase64;logo.classList.add('visible');}
  else logo.classList.remove('visible');
  applyLang();
  renderAll();
});

function renderAll(){renderBracket(gameData.bracket);renderInfo(gameData.info);renderNotices(gameData.notices);renderContacts(gameData.contacts);}

function teamSlot(team,score,isWinner){
  if(!team)return'<div class="team-slot tbd">TBD <span class="slot-score"></span></div>';
  const name=typeof team==='object'?(team.name||'TBD'):team;
  const emoji=typeof team==='object'?(team.emoji||''):'';
  return`<div class="team-slot ${isWinner?'winner':''}">${emoji} ${name} <span class="slot-score">${score||''}</span></div>`;
}
function statusClass(s){return s==='live'?'status-live':s==='done'?'status-done':'status-upcoming';}
function statusLabel(s){
  if(s==='live')return lang==='zh'?'進行中':'LIVE';
  if(s==='done')return lang==='zh'?'完賽':'Done';
  return lang==='zh'?'未開始':'Upcoming';
}

function renderBracket(b){
  if(!b)return;
  const el=document.getElementById('bracket-display');
  const sch=document.getElementById('bracket-schedule');
  const matches=b.matches||[];
  const champ=b.champion||'';

  if(!matches.length){
    el.innerHTML='<div class="loading">尚未設定對戰資料</div>';
  } else {
    const CARD_H=54; // px, height of one match card (2 teams)
    const GAP=10;    // px, gap between cards in round 1
    const UNIT=CARD_H+GAP;
    const COL_W=136; // px, width of each round column including padding

    // Group by round, sort rounds
    const rounds={};
    matches.forEach(m=>{const r=m.round||1;if(!rounds[r])rounds[r]=[];rounds[r].push(m);});
    const roundNums=Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    const rMin=roundNums[0];
    const N1=rounds[rMin].length; // number of first-round matches
    const totalH=N1*UNIT-GAP;

    const ROUND_NAMES=['','十二強','八強','準決賽','冠軍賽','決賽'];

    let html='<div class="bk-outer">';

    roundNums.forEach((rn,ri)=>{
      const rel=rn-rMin; // 0-indexed relative round
      const factor=Math.pow(2,rel);
      const rMatches=rounds[rn];
      const label=ROUND_NAMES[rn]||('第'+rn+'輪');
      const colBodyH=totalH;

      html+=`<div class="bk-col">`;
      html+=`<div class="bk-col-title">${label}</div>`;
      html+=`<div class="bk-col-body" style="width:${COL_W}px;height:${colBodyH}px;position:relative;">`;

      rMatches.forEach((m,mi)=>{
        // Center of this match's slot
        const slotTop=mi*factor*UNIT;
        const slotH=factor*UNIT-GAP;
        const cardTop=slotTop+(slotH-CARD_H)/2;
        const aWin=m.winner===0, bWin=m.winner===1;
        const aName=(m.teamA||'待定').substring(0,6);
        const bName=(m.teamB||'待定').substring(0,6);
        const aE=m.emojiA||''; const bE=m.emojiB||'';

        html+=`<div class="bk-match" style="top:${cardTop}px;height:${CARD_H}px;">
          <div class="bk-team ${aWin?'winner':''}" style="height:${CARD_H/2}px">${aE}${aName}<span class="bk-score">${m.scoreA||''}</span></div>
          <div class="bk-team ${bWin?'winner':''}" style="height:${CARD_H/2}px">${bE}${bName}<span class="bk-score">${m.scoreB||''}</span></div>
        </div>`;

        // Draw connector to next round (only if partner exists)
        if(ri<roundNums.length-1 && mi%2===0){
          const myCenterY=cardTop+CARD_H/2;
          const partnerIdx=mi+1;
          // Only draw if partner match exists in this round
          if(partnerIdx<rMatches.length){
            const partnerSlotTop=partnerIdx*factor*UNIT;
            const partnerSlotH=factor*UNIT-GAP;
            const partnerCardTop=partnerSlotTop+(partnerSlotH-CARD_H)/2;
            const partnerCenterY=partnerCardTop+CARD_H/2;
            const midY=(myCenterY+partnerCenterY)/2;
            const rightX=COL_W-8;
            html+=`<svg style="position:absolute;top:0;left:0;width:${COL_W+24}px;height:${colBodyH}px;overflow:visible;pointer-events:none">
              <line x1="${rightX}" y1="${myCenterY}" x2="${rightX+12}" y2="${myCenterY}" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
              <line x1="${rightX}" y1="${partnerCenterY}" x2="${rightX+12}" y2="${partnerCenterY}" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
              <line x1="${rightX+12}" y1="${myCenterY}" x2="${rightX+12}" y2="${partnerCenterY}" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
              <line x1="${rightX+12}" y1="${midY}" x2="${rightX+24}" y2="${midY}" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>
            </svg>`;
          }
        }
      });

      html+=`</div></div>`;
      // Spacer between columns for connector lines
      if(ri<roundNums.length-1) html+=`<div style="width:24px;flex-shrink:0"></div>`;
    });

    // Champion box centered vertically
    if(champ){
      html+=`<div style="display:flex;align-items:center;height:${totalH+30}px;margin-left:20px;padding-top:28px">
        <div class="bk-champ"><div class="bk-champ-crown">👑</div><div class="bk-champ-label">CHAMPION</div><div class="bk-champ-name">${champ}</div></div>
      </div>`;
    }
    html+='</div>';
    el.innerHTML=html;
  }

  const games=b.schedule||[];
  sch.innerHTML=games.length===0?`<div class="loading">${lang==='zh'?'尚未設定賽程':'No schedule yet'}</div>`:games.map(g=>`
    <div class="game-item">
      <div class="game-time">${g.when||''}<div class="game-court">${g.time||''}</div></div>
      <div class="game-teams">${g.name||''}<br><span style="font-size:11px;color:var(--muted)">${g.teams||''}</span></div>
      <div><span class="game-status ${statusClass(g.status)}">${g.court||''}</span></div>
    </div>`).join('');
}


function renderInfo(info){
  const el=document.getElementById('pub-info-list');
  if(!info||!info.length){el.innerHTML=`<div class="loading">${lang==='zh'?'尚未設定':'Not set'}</div>`;return;}
  el.innerHTML=info.map(i=>`<div class="info-item"><div class="info-icon">${i.icon||'📌'}</div><div><div class="info-label">${lang==='en'&&i.labelEn?i.labelEn:i.label||''}</div><div class="info-value">${lang==='en'&&i.valueEn?i.valueEn:i.value||''}</div>${i.sub?`<div class="info-sub">${lang==='en'&&i.subEn?i.subEn:i.sub}</div>`:''}</div></div>`).join('');
}
function renderNotices(notices){
  const el=document.getElementById('pub-notice-list');
  if(!notices||!notices.length){el.innerHTML=`<div class="loading">${lang==='zh'?'目前無公告':'No announcements'}</div>`;return;}
  el.innerHTML=notices.map(n=>`<div class="notice-item"><div class="notice-time">${n.time||''}</div><div class="notice-text">${lang==='en'&&n.textEn?n.textEn:n.text||''}</div>${n.sub?`<div class="notice-sub">${lang==='en'&&n.subEn?n.subEn:n.sub}</div>`:''}</div>`).join('');
}
function renderContacts(contacts){
  const el=document.getElementById('pub-contact-list');
  if(!contacts||!contacts.length){el.innerHTML=`<div class="loading">${lang==='zh'?'尚未設定':'Not set'}</div>`;return;}
  el.innerHTML=contacts.map(c=>`<div class="info-item"><div class="info-icon">${c.icon||'👤'}</div><div><div class="info-label">${lang==='en'&&c.labelEn?c.labelEn:c.label||''}</div><div class="info-value">${c.name||''}</div><div class="info-sub">${c.contact||''}</div></div></div>`).join('');
}
</script>
</body>
</html>

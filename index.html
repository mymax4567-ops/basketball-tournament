<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>籃球錦標賽</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#13132a;font-family:'Noto Sans TC',sans-serif;}

/* BANNER */
.banner{position:relative;background:linear-gradient(160deg,#7a0fa8 0%,#9b15c4 25%,#b020d0 50%,#9010b8 75%,#6a0a96 100%);min-height:260px;overflow:hidden;}
.stripe-left{position:absolute;top:0;left:0;bottom:0;width:52px;z-index:3;background:repeating-linear-gradient(-45deg,transparent 0,transparent 9px,rgba(0,0,0,0.5) 9px,rgba(0,0,0,0.5) 18px);}
.stripe-right{position:absolute;top:0;right:0;bottom:0;width:52px;z-index:3;background:repeating-linear-gradient(-45deg,transparent 0,transparent 9px,rgba(0,0,0,0.5) 9px,rgba(0,0,0,0.5) 18px);}
.banner-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.banner-body{position:relative;z-index:4;display:flex;align-items:stretch;min-height:260px;padding:0 52px;}
.b-left{width:240px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;}
.b-left img{max-width:220px;max-height:240px;object-fit:contain;filter:drop-shadow(0 6px 20px rgba(0,0,0,0.35));}
.b-left img[src=""]{display:none;}
.b-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 8px;}
.b-org{color:rgba(255,255,255,0.75);font-size:11px;letter-spacing:0.5px;margin-bottom:6px;line-height:1.7;}
.b-org:empty{display:none;}
.b-year{color:#fff;font-size:16px;font-weight:700;margin-bottom:4px;}
.b-year:empty{display:none;}
.b-title{color:#FFE44D;font-weight:900;line-height:1.1;letter-spacing:3px;text-shadow:2px 3px 0 rgba(0,0,0,0.4);margin-bottom:12px;font-size:52px;}
.b-venue{display:inline-block;background:#0f0f0f;color:#fff;font-size:14px;font-weight:700;padding:6px 24px;border-radius:5px;letter-spacing:1px;}
.b-venue:empty{display:none;}
.b-right{width:240px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;}
.b-right img{max-width:220px;max-height:260px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 20px rgba(0,0,0,0.35));}
.b-right img[src=""]{display:none;}
.lang-btn{position:absolute;top:12px;right:68px;z-index:10;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;cursor:pointer;}

/* MAIN TABS - 組別 */
.main-tabs{background:#0a0a1a;border-bottom:2px solid rgba(255,200,0,0.15);display:flex;overflow-x:auto;}
.main-tabs::-webkit-scrollbar{display:none;}
.main-tab{flex-shrink:0;padding:14px 18px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.4);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.main-tab.active{color:#FFD700;border-bottom-color:#FFD700;background:rgba(255,200,0,0.05);}

/* SUB TABS - 分組賽/晉級賽 */
.sub-tabs{background:#0e0e1e;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:center;}
.sub-tab{padding:10px 28px;font-size:12px;font-weight:700;color:rgba(255,255,255,0.4);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.sub-tab.active{color:#FFD700;border-bottom-color:#FFD700;}

/* CONTENT */
.page-content{background:#13132a;min-height:400px;}
.cat-page{display:none;}
.cat-page.active{display:block;}
.sub-page{display:none;padding:16px;max-width:1000px;margin:0 auto;}
.sub-page.active{display:block;}

/* CARD */
.card{background:#1a1a35;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:18px;margin-bottom:14px;}
.card-hd{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);letter-spacing:2px;display:flex;align-items:center;gap:6px;margin-bottom:14px;text-transform:uppercase;}
.card-hd::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07);}

/* GROUP TABS inside bracket */
.grp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.grp-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.45);background:transparent;}
.grp-tab.active{background:#FFD700;color:#111;border-color:#FFD700;}
.grp-panel{display:none;}
.grp-panel.active{display:block;}
.grp-name{font-size:14px;font-weight:900;color:#FFD700;margin-bottom:10px;letter-spacing:1px;}

/* STANDINGS TABLE */
.std-table{width:100%;border-collapse:collapse;font-size:12px;}
.std-table th{padding:7px 5px;color:rgba(255,255,255,0.35);font-size:10px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.07);text-align:center;}
.std-table th:first-child{text-align:left;}
.std-table td{padding:9px 5px;border-bottom:1px solid rgba(255,255,255,0.04);text-align:center;font-weight:700;color:#ccc;}
.std-table td:first-child{text-align:left;}
.std-table tr:last-child td{border-bottom:none;}
.rk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:900;margin-right:4px;}
.rk1{background:#FFD700;color:#000;}
.rk2{background:#C0C0C0;color:#000;}
.rk3{background:#CD7F32;color:#fff;}
.rko{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);}
.adv{display:inline-block;background:rgba(0,200,150,0.15);color:#00C896;font-size:9px;padding:1px 5px;border-radius:4px;margin-left:3px;}

/* BRACKET */
.bk-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
.bk-wrap{display:inline-flex;align-items:flex-start;padding:4px;}
.bk-col{display:flex;flex-direction:column;align-items:center;}
.bk-rl{font-size:10px;font-weight:700;letter-spacing:2px;color:#FFD700;text-transform:uppercase;text-align:center;margin-bottom:10px;white-space:nowrap;padding:0 8px;}
.bk-col-body{position:relative;}
.bk-m{position:absolute;background:#21213d;border:1px solid rgba(255,255,255,0.1);border-radius:8px;width:128px;overflow:hidden;left:8px;}
.bk-t{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;font-size:11px;font-weight:700;color:#ccc;border-bottom:1px solid rgba(255,255,255,0.06);white-space:nowrap;overflow:hidden;}
.bk-t:last-child{border-bottom:none;}
.bk-t.win{background:rgba(230,120,0,0.25);color:#FFB347;}
.bk-t.tbd{color:rgba(255,255,255,0.2);font-style:italic;}
.bk-s{font-size:13px;font-weight:900;color:#FFB347;margin-left:3px;flex-shrink:0;}
.bk-champ{background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(180,80,0,0.15));border:2px solid #FFD700;border-radius:12px;padding:14px 12px;text-align:center;min-width:105px;}
.bk-champ .cr{font-size:26px;display:block;}
.bk-champ .lb{font-size:8px;letter-spacing:3px;color:#FFD700;font-weight:700;display:block;margin:3px 0;}
.bk-champ .nm{font-size:16px;font-weight:900;color:#FFD700;display:block;}

/* INFO */
.info-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.06);align-items:flex-start;}
.info-row:last-child{border-bottom:none;}
.info-ico{width:36px;height:36px;background:rgba(255,200,0,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.info-lbl{font-size:10px;color:rgba(255,255,255,0.3);font-weight:700;letter-spacing:1px;}
.info-val{font-size:14px;font-weight:700;color:#fff;margin-top:2px;}
.info-note{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px;}
.ntc{background:rgba(255,200,0,0.06);border-left:3px solid #FFD700;border-radius:0 8px 8px 0;padding:11px 13px;margin-bottom:9px;}
.ntc-t{font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:3px;}
.ntc-m{font-size:13px;font-weight:700;color:#fff;}
.loading{text-align:center;padding:36px;color:rgba(255,255,255,0.2);font-size:12px;}
footer{text-align:center;padding:14px;color:rgba(255,255,255,0.2);font-size:10px;border-top:1px solid rgba(255,255,255,0.05);}

@media(max-width:580px){
  .b-left,.b-right{width:90px;}
  .b-left img,.b-right img{max-width:80px;max-height:130px;}
  .b-title{font-size:32px;letter-spacing:1px;}
  .stripe-left,.stripe-right{width:28px;}
  .banner-body{padding:0 28px;}
}
</style>
</head>
<body>

<!-- BANNER -->
<div class="banner" id="pub-header-wrap">
  <button class="lang-btn" onclick="toggleLang()" id="lang-toggle">EN</button>
  <div class="stripe-left"></div>
  <div class="stripe-right"></div>
  <svg class="banner-svg" viewBox="0 0 1400 260" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <circle cx="260" cy="320" r="190" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" stroke-dasharray="7 7"/>
    <circle cx="260" cy="320" r="250" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="7 7"/>
    <circle cx="1140" cy="320" r="170" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="7 7"/>
    <circle cx="1140" cy="320" r="230" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" stroke-dasharray="7 7"/>
  </svg>
  <div class="banner-body">
    <div class="b-left"><img id="pub-left-img" src="" alt=""/></div>
    <div class="b-center">
      <div class="b-org" id="pub-org-bar"></div>
      <div class="b-year" id="pub-badge"></div>
      <h1 class="b-title" id="pub-title">籃球錦標賽</h1>
      <div><span class="b-venue" id="pub-venue"></span></div>
    </div>
    <div class="b-right"><img id="pub-right-img" src="" alt=""/></div>
  </div>
</div>

<!-- 主分頁：4個組別 + 活動資訊 -->
<nav class="main-tabs" id="main-tabs">
  <div class="main-tab active" onclick="showCat('jh_boys',this)">🏀 國中男子組</div>
  <div class="main-tab" onclick="showCat('jh_girls',this)">🏀 國中女子組</div>
  <div class="main-tab" onclick="showCat('sh_boys',this)">🏀 高中男子組</div>
  <div class="main-tab" onclick="showCat('sh_girls',this)">🏀 高中女子組</div>
  <div class="main-tab" onclick="showCat('info',this)">📋 活動資訊</div>
</nav>

<div class="page-content">

  <!-- 每個組別頁面 -->
  <div id="cat-jh_boys" class="cat-page active"></div>
  <div id="cat-jh_girls" class="cat-page"></div>
  <div id="cat-sh_boys" class="cat-page"></div>
  <div id="cat-sh_girls" class="cat-page"></div>

  <!-- 活動資訊 -->
  <div id="cat-info" class="cat-page">
    <div style="padding:16px;max-width:800px;margin:0 auto">
      <div class="card"><div class="card-hd">ℹ️ 活動基本資訊</div><div id="pub-info-list"><div class="loading">載入中...</div></div></div>
      <div class="card"><div class="card-hd">📢 最新公告</div><div id="pub-notice-list"><div class="loading">目前無公告</div></div></div>
      <div class="card"><div class="card-hd">📞 聯絡資訊</div><div id="pub-contact-list"><div class="loading">載入中...</div></div></div>
    </div>
  </div>
</div>

<footer id="pub-footer">🏀 籃球錦標賽 · 技術支援：主辦單位</footer>

<script>
const firebaseConfig={apiKey:"AIzaSyAvXt3l1WIwuwzTEiK8f0pXtC73qyu8p28",authDomain:"funplay-f29f4.firebaseapp.com",databaseURL:"https://funplay-f29f4-default-rtdb.firebaseio.com",projectId:"funplay-f29f4",storageBucket:"funplay-f29f4.firebasestorage.app",messagingSenderId:"931596968438",appId:"1:931596968438:web:c47a7c31f4cc3b4adee7d7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let lang='zh', gameData={};
const CAT_KEYS=['jh_boys','jh_girls','sh_boys','sh_girls'];
const CAT_NAMES={jh_boys:'國中男子組',jh_girls:'國中女子組',sh_boys:'高中男子組',sh_girls:'高中女子組'};
const ROUND_LBL={1:'十六強',2:'十二強',3:'八強',4:'四強',5:'冠軍賽'};
const GRP_NAMES=['A組','B組','C組','D組'];

try{db.ref('/stats/visits').transaction(v=>(v||0)+1);}catch(e){}

function toggleLang(){lang=lang==='zh'?'en':'zh';document.getElementById('lang-toggle').textContent=lang==='zh'?'EN':'中文';applyLang();}

// ── MAIN TAB ──
function showCat(key,btn){
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.cat-page').forEach(p=>p.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const el=document.getElementById('cat-'+key);
  if(el) el.classList.add('active');
  try{db.ref('/stats/tabs/'+key).transaction(v=>(v||0)+1);}catch(e){}
}

// ── SUB TAB ──
function showSub(catKey,sub){
  document.querySelectorAll(`#cat-${catKey} .sub-tab`).forEach(t=>t.classList.remove('active'));
  document.querySelectorAll(`#cat-${catKey} .sub-page`).forEach(p=>p.classList.remove('active'));
  const tab=document.querySelector(`#cat-${catKey} [data-sub="${sub}"]`);
  const page=document.getElementById(`sp-${catKey}-${sub}`);
  if(tab) tab.classList.add('active');
  if(page) page.classList.add('active');
}

// ── FIREBASE ──
db.ref('/game').on('value',snap=>{
  try{
    gameData=snap.val()||{};
    applyLang();
    CAT_KEYS.forEach(key=>buildCatPage(key,gameData.categories?.[key]));
    renderInfo(gameData.info);
    renderNotices(gameData.notices);
    renderContacts(gameData.contacts);
  }catch(e){console.error(e);}
});

function applyLang(){
  try{
    const d=gameData.header||{};
    const set=(id,v,h)=>{const e=document.getElementById(id);if(e){if(h)e.innerHTML=v;else e.textContent=v;}};
    set('pub-org-bar',d.orgBar||'',true);
    set('pub-badge',lang==='en'&&d.badgeEn?d.badgeEn:(d.badge||''));
    set('pub-title',lang==='en'&&d.titleEn?d.titleEn:(d.title||'籃球錦標賽'),true);
    const tEl=document.getElementById('pub-title');
    if(tEl){tEl.style.fontSize=(d.titleSize||52)+'px';tEl.style.color=d.titleColor||'#FFE44D';}
    set('pub-venue',d.venue||'');
    set('pub-footer',d.footer||'🏀 籃球錦標賽 · 技術支援：主辦單位');
    document.title=(d.title||'籃球錦標賽').replace(/<[^>]+>/g,'');
    try{
      const l=document.getElementById('pub-left-img'),r=document.getElementById('pub-right-img');
      if(l) l.src=d.leftImgBase64||'';
      if(r) r.src=d.rightImgBase64||'';
    }catch(e){}
  }catch(e){}
}

// ── BUILD CATEGORY PAGE ──
function buildCatPage(catKey, catData){
  const container=document.getElementById('cat-'+catKey);
  if(!container) return;
  const catName=CAT_NAMES[catKey];

  // Build the page HTML
  container.innerHTML=`
    <nav class="sub-tabs">
      <div class="sub-tab active" data-sub="groups" onclick="showSub('${catKey}','groups')">📊 分組賽</div>
      <div class="sub-tab" data-sub="bracket" onclick="showSub('${catKey}','bracket')">🏆 晉級賽</div>
    </nav>

    <!-- 分組賽 -->
    <div class="sub-page active" id="sp-${catKey}-groups">
      <div class="card">
        <div class="card-hd">📊 分組賽積分榜 — ${catName}</div>
        <div class="grp-tabs" id="gtabs-${catKey}">
          ${GRP_NAMES.map((g,i)=>`<button class="grp-tab ${i===0?'active':''}" onclick="showGrp('${catKey}',${i},this)">${g}</button>`).join('')}
        </div>
        ${GRP_NAMES.map((g,i)=>`
          <div class="grp-panel ${i===0?'active':''}" id="gp-${catKey}-${i}">
            <div class="grp-name">🏀 ${g}</div>
            <div id="gst-${catKey}-${i}"><div class="loading">尚未設定隊伍</div></div>
          </div>`).join('')}
      </div>
    </div>

    <!-- 晉級賽 -->
    <div class="sub-page" id="sp-${catKey}-bracket">
      <div class="card">
        <div class="card-hd">🏆 晉級賽對戰圖 — ${catName}</div>
        <div class="bk-scroll"><div class="bk-wrap" id="bk-${catKey}"><div class="loading">尚未設定對戰資料</div></div></div>
      </div>
    </div>`;

  // Render data if available
  if(catData){
    renderGroups(catKey, catData.groups);
    renderBracket(catKey, catData.matches, catData.champion);
  }
}

function showGrp(catKey,idx,btn){
  document.querySelectorAll(`#gtabs-${catKey} .grp-tab`).forEach(t=>t.classList.remove('active'));
  document.querySelectorAll(`#gp-${catKey}-0,#gp-${catKey}-1,#gp-${catKey}-2,#gp-${catKey}-3`).forEach(p=>p.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const p=document.getElementById(`gp-${catKey}-${idx}`);
  if(p) p.classList.add('active');
}

// ── RENDER GROUPS ──
function renderGroups(catKey, groups){
  if(!groups) return;
  [0,1,2,3].forEach(i=>{
    const el=document.getElementById(`gst-${catKey}-${i}`);
    if(!el) return;
    const g=groups[i];
    if(!g||!g.teams||!g.teams.length){el.innerHTML='<div class="loading">尚未設定隊伍</div>';return;}
    const sorted=[...g.teams].sort((a,b)=>(b.pts||0)-(a.pts||0)||(b.w||0)-(a.w||0));
    el.innerHTML=`<table class="std-table">
      <thead><tr>
        <th>隊伍</th><th>場</th><th>勝</th><th>負</th><th>積分</th><th>得分差</th>
      </tr></thead>
      <tbody>${sorted.map((t,ri)=>{
        const rkC=ri===0?'rk1':ri===1?'rk2':ri===2?'rk3':'rko';
        const adv=g.advance&&ri<g.advance?'<span class="adv">晉級</span>':'';
        return`<tr>
          <td><span class="rk ${rkC}">${ri+1}</span>${t.name||''}${adv}</td>
          <td>${(t.w||0)+(t.l||0)}</td>
          <td style="color:#00C896">${t.w||0}</td>
          <td style="color:#FF4466">${t.l||0}</td>
          <td style="color:#FFD700;font-size:14px">${(t.w||0)*3}</td>
          <td style="color:rgba(255,255,255,0.4)">${t.diff||0}</td>
        </tr>`}).join('')}</tbody></table>`;
  });
}

// ── RENDER BRACKET ──
function renderBracket(catKey, matches, champ){
  const el=document.getElementById('bk-'+catKey);
  if(!el) return;
  if(!matches||!matches.length){el.innerHTML='<div class="loading">尚未設定對戰資料</div>';return;}
  const CH=52,G=10,U=CH+G,CW=144;
  const rounds={};
  matches.forEach(m=>{const r=m.round||1;if(!rounds[r])rounds[r]=[];rounds[r].push(m);});
  const rNums=Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const rMin=rNums[0],N1=rounds[rMin].length,TH=N1*U-G;
  let html='<div class="bk-wrap">';
  rNums.forEach((rn,ri)=>{
    const rel=rn-rMin,fac=Math.pow(2,rel);
    const ms=rounds[rn];
    const lbl=ROUND_LBL[rn]||('第'+rn+'輪');
    html+=`<div class="bk-col"><div class="bk-rl">${lbl}</div><div class="bk-col-body" style="width:${CW}px;height:${TH}px;position:relative;">`;
    ms.forEach((m,mi)=>{
      const sTop=mi*fac*U,sH=fac*U-G,cTop=sTop+(sH-CH)/2;
      const aW=m.winner===0,bW=m.winner===1;
      const aN=(m.teamA||'').substring(0,7)||'待定';
      const bN=(m.teamB||'').substring(0,7)||'待定';
      html+=`<div class="bk-m" style="top:${cTop}px;height:${CH}px;">
        <div class="bk-t ${aW?'win':(!m.teamA?'tbd':'')}" style="height:${CH/2}px">${m.emojiA||''}${aN}<span class="bk-s">${m.scoreA||''}</span></div>
        <div class="bk-t ${bW?'win':(!m.teamB?'tbd':'')}" style="height:${CH/2}px">${m.emojiB||''}${bN}<span class="bk-s">${m.scoreB||''}</span></div>
      </div>`;
      if(ri<rNums.length-1&&mi%2===0&&mi+1<ms.length){
        const cy1=cTop+CH/2,ct2=((mi+1)*fac*U)+(fac*U-G-CH)/2,cy2=ct2+CH/2,midY=(cy1+cy2)/2,rx=CW-8;
        html+=`<svg style="position:absolute;top:0;left:0;width:${CW+24}px;height:${TH}px;overflow:visible;pointer-events:none">
          <line x1="${rx}" y1="${cy1}" x2="${rx+12}" y2="${cy1}" stroke="#FFB347" stroke-width="2" opacity="0.7"/>
          <line x1="${rx}" y1="${cy2}" x2="${rx+12}" y2="${cy2}" stroke="#FFB347" stroke-width="2" opacity="0.7"/>
          <line x1="${rx+12}" y1="${cy1}" x2="${rx+12}" y2="${cy2}" stroke="#FFB347" stroke-width="2" opacity="0.7"/>
          <line x1="${rx+12}" y1="${midY}" x2="${rx+24}" y2="${midY}" stroke="#FFB347" stroke-width="2" opacity="0.7"/>
        </svg>`;
      }
    });
    html+=`</div></div>`;
    if(ri<rNums.length-1)html+=`<div style="width:24px;flex-shrink:0"></div>`;
  });
  if(champ)html+=`<div style="display:flex;align-items:center;height:${TH}px;margin-left:20px;"><div class="bk-champ"><span class="cr">👑</span><span class="lb">CHAMPION</span><span class="nm">${champ}</span></div></div>`;
  html+='</div>';
  el.innerHTML=html;
}

function renderInfo(info){const el=document.getElementById('pub-info-list');if(!el)return;if(!info||!info.length){el.innerHTML='<div class="loading">尚未設定</div>';return;}el.innerHTML=info.map(i=>`<div class="info-row"><div class="info-ico">${i.icon||'📌'}</div><div><div class="info-lbl">${i.label||''}</div><div class="info-val">${i.value||''}</div>${i.sub?`<div class="info-note">${i.sub}</div>`:''}</div></div>`).join('');}
function renderNotices(n){const el=document.getElementById('pub-notice-list');if(!el)return;if(!n||!n.length){el.innerHTML='<div class="loading">目前無公告</div>';return;}el.innerHTML=n.map(x=>`<div class="ntc"><div class="ntc-t">${x.time||''}</div><div class="ntc-m">${x.text||''}</div></div>`).join('');}
function renderContacts(c){const el=document.getElementById('pub-contact-list');if(!el)return;if(!c||!c.length){el.innerHTML='<div class="loading">尚未設定</div>';return;}el.innerHTML=c.map(x=>`<div class="info-row"><div class="info-ico">${x.icon||'👤'}</div><div><div class="info-lbl">${x.label||''}</div><div class="info-val">${x.name||''}</div><div class="info-note">${x.contact||''}</div></div></div>`).join('');}
</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>籃球錦標賽</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#13132a;font-family:'Noto Sans TC',sans-serif;}

/* ── BANNER ── */
.banner{position:relative;background:linear-gradient(160deg,#7a0fa8 0%,#9b15c4 25%,#b020d0 50%,#9010b8 75%,#6a0a96 100%);min-height:280px;overflow:hidden;}
.stripe-left{position:absolute;top:0;left:0;bottom:0;width:52px;z-index:3;background:repeating-linear-gradient(-45deg,transparent 0,transparent 9px,rgba(0,0,0,0.5) 9px,rgba(0,0,0,0.5) 18px);}
.stripe-right{position:absolute;top:0;right:0;bottom:0;width:52px;z-index:3;background:repeating-linear-gradient(-45deg,transparent 0,transparent 9px,rgba(0,0,0,0.5) 9px,rgba(0,0,0,0.5) 18px);}
.banner-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.banner-body{position:relative;z-index:4;display:flex;align-items:stretch;min-height:280px;padding:0 52px;}
.b-left{width:260px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;padding:16px 0 0;}
.b-left img{width:240px;max-height:260px;object-fit:contain;filter:drop-shadow(0 6px 20px rgba(0,0,0,0.35));display:block;}
.b-left img[src=""]{display:none;}
.b-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 8px;}
.b-org{color:rgba(255,255,255,0.75);font-size:12px;letter-spacing:0.5px;margin-bottom:6px;line-height:1.7;}
.b-org:empty{display:none;}
.b-year{color:#fff;font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:1px;}
.b-year:empty{display:none;}
.b-title{color:#FFE44D;font-weight:900;line-height:1.1;letter-spacing:4px;text-shadow:2px 3px 0 rgba(0,0,0,0.4);margin-bottom:14px;font-size:56px;}
.b-venue-box{display:inline-block;background:#0f0f0f;color:#fff;font-size:15px;font-weight:700;padding:7px 28px;border-radius:6px;letter-spacing:2px;}
.b-venue-box:empty{display:none;}
.b-right{width:260px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;}
.b-right img{width:240px;max-height:280px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 20px rgba(0,0,0,0.35));display:block;}
.b-right img[src=""]{display:none;}
.lang-btn{position:absolute;top:12px;right:68px;z-index:10;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;cursor:pointer;}

/* ── MAIN TABS (組別) ── */
.main-tabs{background:#0a0a1a;border-bottom:2px solid rgba(255,200,0,0.2);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.main-tabs::-webkit-scrollbar{display:none;}
.main-tab{
  flex-shrink:0;padding:14px 20px;font-size:13px;font-weight:700;
  color:rgba(255,255,255,0.4);cursor:pointer;
  border-bottom:3px solid transparent;transition:all 0.2s;
  white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.main-tab.active{color:#FFD700;border-bottom-color:#FFD700;background:rgba(255,200,0,0.05);}

/* ── SUB TABS (賽程/資訊) ── */
.sub-tabs{background:#0e0e20;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:center;}
.sub-tab{padding:11px 32px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.4);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;}
.sub-tab.active{color:#FFD700;border-bottom-color:#FFD700;}

/* ── CONTENT ── */
.page-content{background:#13132a;min-height:500px;}
.cat-section{display:none;}
.cat-section.active{display:block;}
.sub-section{display:none;padding:20px 16px;max-width:1000px;margin:0 auto;}
.sub-section.active{display:block;}

/* Card */
.card{background:#1a1a35;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:20px;margin-bottom:16px;}
.card-title{font-size:12px;font-weight:700;color:rgba(255,255,255,0.4);letter-spacing:2px;display:flex;align-items:center;gap:8px;margin-bottom:16px;text-transform:uppercase;}
.card-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07);}

/* ── BRACKET ── */
.bk-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
.bk-wrap{display:inline-flex;align-items:flex-start;padding:4px;}
.bk-col{display:flex;flex-direction:column;align-items:center;}
.bk-round-lbl{font-size:11px;font-weight:700;letter-spacing:2px;color:#FFD700;text-transform:uppercase;text-align:center;margin-bottom:10px;white-space:nowrap;padding:0 8px;}
.bk-col-body{position:relative;}
.bk-match{position:absolute;background:#21213d;border:1px solid rgba(255,255,255,0.1);border-radius:8px;width:130px;overflow:hidden;left:8px;}
.bk-team{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:12px;font-weight:700;color:#ccc;border-bottom:1px solid rgba(255,255,255,0.07);white-space:nowrap;overflow:hidden;}
.bk-team:last-child{border-bottom:none;}
.bk-team.win{background:rgba(230,120,0,0.25);color:#FFB347;}
.bk-team.tbd{color:rgba(255,255,255,0.25);font-style:italic;}
.bk-pts{font-size:14px;font-weight:900;color:#FFB347;margin-left:4px;flex-shrink:0;}
.bk-champ{background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(180,80,0,0.15));border:2px solid #FFD700;border-radius:12px;padding:16px 12px;text-align:center;min-width:110px;}
.bk-champ .crown{font-size:28px;display:block;}
.bk-champ .lbl{font-size:9px;letter-spacing:3px;color:#FFD700;font-weight:700;display:block;margin:4px 0;}
.bk-champ .name{font-size:18px;font-weight:900;color:#FFD700;display:block;}

/* Info */
.info-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);align-items:flex-start;}
.info-row:last-child{border-bottom:none;}
.info-ico{width:36px;height:36px;background:rgba(255,200,0,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.info-lbl{font-size:10px;color:rgba(255,255,255,0.3);font-weight:700;letter-spacing:1px;}
.info-val{font-size:14px;font-weight:700;color:#fff;margin-top:2px;}
.info-note{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px;}
.notice-box{background:rgba(255,200,0,0.06);border-left:3px solid #FFD700;border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:10px;}
.notice-when{font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:3px;}
.notice-msg{font-size:13px;font-weight:700;color:#fff;}
.loading{text-align:center;padding:40px;color:rgba(255,255,255,0.2);font-size:13px;}
footer{text-align:center;padding:16px;color:rgba(255,255,255,0.2);font-size:10px;border-top:1px solid rgba(255,255,255,0.05);}

@media(max-width:600px){
  .b-left,.b-right{width:100px;}
  .b-left img,.b-right img{width:85px;max-height:140px;}
  .b-title{font-size:34px;letter-spacing:2px;}
  .stripe-left,.stripe-right{width:28px;}
  .banner-body{padding:0 28px;}
}
</style>
</head>
<body>

<!-- BANNER -->
<div class="banner" id="pub-header-wrap">
  <button class="lang-btn" onclick="toggleLang()" id="lang-toggle">EN</button>
  <div class="stripe-left"></div>
  <div class="stripe-right"></div>
  <svg class="banner-svg" viewBox="0 0 1400 280" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <circle cx="280" cy="340" r="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="7 7"/>
    <circle cx="280" cy="340" r="260" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5" stroke-dasharray="7 7"/>
    <circle cx="280" cy="340" r="320" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" stroke-dasharray="7 7"/>
    <circle cx="1120" cy="340" r="180" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" stroke-dasharray="7 7"/>
    <circle cx="1120" cy="340" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="7 7"/>
  </svg>
  <div class="banner-body">
    <div class="b-left"><img id="pub-left-img" src="" alt=""/></div>
    <div class="b-center">
      <div class="b-org" id="pub-org-bar"></div>
      <div class="b-year" id="pub-badge"></div>
      <h1 class="b-title" id="pub-title">籃球錦標賽</h1>
      <div><span class="b-venue-box" id="pub-venue"></span></div>
    </div>
    <div class="b-right"><img id="pub-right-img" src="" alt=""/></div>
  </div>
</div>

<!-- 主分頁 (4個組別 + 活動資訊) -->
<nav class="main-tabs">
  <div class="main-tab active" onclick="showCat('jh_boys')">🏀 國中男子組</div>
  <div class="main-tab" onclick="showCat('jh_girls')">🏀 國中女子組</div>
  <div class="main-tab" onclick="showCat('sh_boys')">🏀 高中男子組</div>
  <div class="main-tab" onclick="showCat('sh_girls')">🏀 高中女子組</div>
  <div class="main-tab" onclick="showCat('info')">📋 活動資訊</div>
</nav>

<!-- 每個組別的子分頁 -->
<div class="page-content">

  <!-- 國中男子組 -->
  <div class="cat-section active" id="cat-jh_boys">
    <nav class="sub-tabs">
      <div class="sub-tab active" onclick="showSub('jh_boys','bracket',this)">🏆 賽程賽果</div>
    </nav>
    <div class="sub-section active" id="sub-jh_boys-bracket">
      <div class="card">
        <div class="card-title">🏆 淘汰賽對戰圖 — 國中男子組</div>
        <div class="bk-scroll"><div class="bk-wrap" id="bk-jh_boys"><div class="loading">載入中...</div></div></div>
      </div>
    </div>
  </div>

  <!-- 國中女子組 -->
  <div class="cat-section" id="cat-jh_girls">
    <nav class="sub-tabs">
      <div class="sub-tab active" onclick="showSub('jh_girls','bracket',this)">🏆 賽程賽果</div>
    </nav>
    <div class="sub-section active" id="sub-jh_girls-bracket">
      <div class="card">
        <div class="card-title">🏆 淘汰賽對戰圖 — 國中女子組</div>
        <div class="bk-scroll"><div class="bk-wrap" id="bk-jh_girls"><div class="loading">載入中...</div></div></div>
      </div>
    </div>
  </div>

  <!-- 高中男子組 -->
  <div class="cat-section" id="cat-sh_boys">
    <nav class="sub-tabs">
      <div class="sub-tab active" onclick="showSub('sh_boys','bracket',this)">🏆 賽程賽果</div>
    </nav>
    <div class="sub-section active" id="sub-sh_boys-bracket">
      <div class="card">
        <div class="card-title">🏆 淘汰賽對戰圖 — 高中男子組</div>
        <div class="bk-scroll"><div class="bk-wrap" id="bk-sh_boys"><div class="loading">載入中...</div></div></div>
      </div>
    </div>
  </div>

  <!-- 高中女子組 -->
  <div class="cat-section" id="cat-sh_girls">
    <nav class="sub-tabs">
      <div class="sub-tab active" onclick="showSub('sh_girls','bracket',this)">🏆 賽程賽果</div>
    </nav>
    <div class="sub-section active" id="sub-sh_girls-bracket">
      <div class="card">
        <div class="card-title">🏆 淘汰賽對戰圖 — 高中女子組</div>
        <div class="bk-scroll"><div class="bk-wrap" id="bk-sh_girls"><div class="loading">載入中...</div></div></div>
      </div>
    </div>
  </div>

  <!-- 活動資訊 -->
  <div class="cat-section" id="cat-info">
    <div style="padding:20px 16px;max-width:800px;margin:0 auto">
      <div class="card">
        <div class="card-title">ℹ️ 活動基本資訊</div>
        <div id="pub-info-list"><div class="loading">載入中...</div></div>
      </div>
      <div class="card">
        <div class="card-title">📢 最新公告</div>
        <div id="pub-notice-list"><div class="loading">目前無公告</div></div>
      </div>
      <div class="card">
        <div class="card-title">📞 聯絡資訊</div>
        <div id="pub-contact-list"><div class="loading">載入中...</div></div>
      </div>
    </div>
  </div>

</div>

<footer id="pub-footer">🏀 籃球錦標賽 · 技術支援：主辦單位</footer>

<script>
const firebaseConfig={apiKey:"AIzaSyAvXt3l1WIwuwzTEiK8f0pXtC73qyu8p28",authDomain:"funplay-f29f4.firebaseapp.com",databaseURL:"https://funplay-f29f4-default-rtdb.firebaseio.com",projectId:"funplay-f29f4",storageBucket:"funplay-f29f4.firebasestorage.app",messagingSenderId:"931596968438",appId:"1:931596968438:web:c47a7c31f4cc3b4adee7d7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let lang='zh', gameData={};
const CAT_KEYS=['jh_boys','jh_girls','sh_boys','sh_girls'];
const ROUND_LABELS={1:'十六強',2:'十二強',3:'八強',4:'四強',5:'冠軍賽'};

try{db.ref('/stats/visits').transaction(v=>(v||0)+1);}catch(e){}

function toggleLang(){lang=lang==='zh'?'en':'zh';document.getElementById('lang-toggle').textContent=lang==='zh'?'EN':'中文';applyLang();}

function showCat(key){
  document.querySelectorAll('.main-tab').forEach((t,i)=>t.classList.toggle('active',['jh_boys','jh_girls','sh_boys','sh_girls','info'][i]===key));
  document.querySelectorAll('.cat-section').forEach(s=>s.classList.toggle('active',s.id==='cat-'+key));
  try{db.ref('/stats/tabs/'+key).transaction(v=>(v||0)+1);}catch(e){}
}

function showSub(cat,sub,btn){
  const subs=document.querySelectorAll(`#cat-${cat} .sub-section`);
  const tabs=document.querySelectorAll(`#cat-${cat} .sub-tab`);
  subs.forEach(s=>s.classList.remove('active'));
  tabs.forEach(t=>t.classList.remove('active'));
  const el=document.getElementById('sub-'+cat+'-'+sub);
  if(el) el.classList.add('active');
  if(btn) btn.classList.add('active');
}

function $id(id){return document.getElementById(id);}
function set(id,v,h){const e=$id(id);if(e){if(h)e.innerHTML=v;else e.textContent=v;}}

function applyLang(){
  try{
    const d=gameData.header||{};
    set('pub-org-bar',d.orgBar||'',true);
    set('pub-badge',lang==='en'&&d.badgeEn?d.badgeEn:(d.badge||''));
    set('pub-title',lang==='en'&&d.titleEn?d.titleEn:(d.title||'籃球錦標賽'),true);
    const tEl=$id('pub-title');
    if(tEl){tEl.style.fontSize=(d.titleSize||56)+'px';tEl.style.color=d.titleColor||'#FFE44D';}
    set('pub-venue',d.venue||'');
    set('pub-footer',d.footer||'🏀 籃球錦標賽 · 技術支援：主辦單位');
    document.title=(d.title||'籃球錦標賽').replace(/<[^>]+>/g,'');
    try{
      const l=$id('pub-left-img'),r=$id('pub-right-img');
      if(l) l.src=d.leftImgBase64||'';
      if(r) r.src=d.rightImgBase64||'';
    }catch(e){}
  }catch(e){console.error(e);}
}

db.ref('/game').on('value',snap=>{
  try{
    gameData=snap.val()||{};
    applyLang();
    CAT_KEYS.forEach(key=>renderCatBracket(key,gameData.categories?.[key]));
    renderInfo(gameData.info);
    renderNotices(gameData.notices);
    renderContacts(gameData.contacts);
  }catch(e){console.error(e);}
});

function renderCatBracket(catKey, catData){
  const el=$id('bk-'+catKey);
  if(!el) return;
  if(!catData||!catData.matches||!catData.matches.length){
    el.innerHTML='<div class="loading">尚未設定對戰資料</div>';return;
  }
  const matches=catData.matches;
  const champ=catData.champion||'';
  const CH=54,G=10,U=CH+G,CW=146;
  const rounds={};
  matches.forEach(m=>{const r=m.round||1;if(!rounds[r])rounds[r]=[];rounds[r].push(m);});
  const rNums=Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const rMin=rNums[0],N1=rounds[rMin].length,TH=N1*U-G;
  let html='<div class="bk-wrap">';
  rNums.forEach((rn,ri)=>{
    const rel=rn-rMin,fac=Math.pow(2,rel);
    const ms=rounds[rn];
    const lbl=ROUND_LABELS[rn]||('第'+rn+'輪');
    html+=`<div class="bk-col"><div class="bk-round-lbl">${lbl}</div>`;
    html+=`<div class="bk-col-body" style="width:${CW}px;height:${TH}px;position:relative;">`;
    ms.forEach((m,mi)=>{
      const sTop=mi*fac*U,sH=fac*U-G,cTop=sTop+(sH-CH)/2;
      const aW=m.winner===0,bW=m.winner===1;
      const aN=(m.teamA||'').substring(0,7)||'待定';
      const bN=(m.teamB||'').substring(0,7)||'待定';
      const aE=m.emojiA||'',bE=m.emojiB||'';
      html+=`<div class="bk-match" style="top:${cTop}px;height:${CH}px;">
        <div class="bk-team ${aW?'win':(!m.teamA?'tbd':'')}" style="height:${CH/2}px">${aE}${aN}<span class="bk-pts">${m.scoreA||''}</span></div>
        <div class="bk-team ${bW?'win':(!m.teamB?'tbd':'')}" style="height:${CH/2}px">${bE}${bN}<span class="bk-pts">${m.scoreB||''}</span></div>
      </div>`;
      if(ri<rNums.length-1&&mi%2===0&&mi+1<ms.length){
        const cy1=cTop+CH/2;
        const ct2=((mi+1)*fac*U)+(fac*U-G-CH)/2;
        const cy2=ct2+CH/2,midY=(cy1+cy2)/2,rx=CW-8;
        html+=`<svg style="position:absolute;top:0;left:0;width:${CW+24}px;height:${TH}px;overflow:visible;pointer-events:none">
          <line x1="${rx}" y1="${cy1}" x2="${rx+12}" y2="${cy1}" stroke="#FFB347" stroke-width="2" opacity="0.7"/>
          <line x1="${rx}" y1="${cy2}" x2="${rx+12}" y2="${cy2}" stroke="#FFB347" stroke-width="2" opacity="0.7"/>
          <line x1="${rx+12}" y1="${cy1}" x2="${rx+12}" y2="${cy2}" stroke="#FFB347" stroke-width="2" opacity="0.7"/>
          <line x1="${rx+12}" y1="${midY}" x2="${rx+24}" y2="${midY}" stroke="#FFB347" stroke-width="2" opacity="0.7"/>
        </svg>`;
      }
    });
    html+=`</div></div>`;
    if(ri<rNums.length-1)html+=`<div style="width:24px;flex-shrink:0"></div>`;
  });
  if(champ){
    html+=`<div style="display:flex;align-items:center;height:${TH}px;margin-left:20px;">
      <div class="bk-champ"><span class="crown">👑</span><span class="lbl">CHAMPION</span><span class="name">${champ}</span></div>
    </div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}

function renderInfo(info){
  const el=$id('pub-info-list');if(!el)return;
  if(!info||!info.length){el.innerHTML='<div class="loading">尚未設定</div>';return;}
  el.innerHTML=info.map(i=>`<div class="info-row"><div class="info-ico">${i.icon||'📌'}</div><div><div class="info-lbl">${i.label||''}</div><div class="info-val">${i.value||''}</div>${i.sub?`<div class="info-note">${i.sub}</div>`:''}</div></div>`).join('');
}
function renderNotices(n){
  const el=$id('pub-notice-list');if(!el)return;
  if(!n||!n.length){el.innerHTML='<div class="loading">目前無公告</div>';return;}
  el.innerHTML=n.map(x=>`<div class="notice-box"><div class="notice-when">${x.time||''}</div><div class="notice-msg">${x.text||''}</div></div>`).join('');
}
function renderContacts(c){
  const el=$id('pub-contact-list');if(!el)return;
  if(!c||!c.length){el.innerHTML='<div class="loading">尚未設定</div>';return;}
  el.innerHTML=c.map(x=>`<div class="info-row"><div class="info-ico">${x.icon||'👤'}</div><div><div class="info-lbl">${x.label||''}</div><div class="info-val">${x.name||''}</div><div class="info-note">${x.contact||''}</div></div></div>`).join('');
}
</script>
</body>
</html>
